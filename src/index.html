      {
        "@context": "https://schema.org",
        "@type": ["School", "EducationalOrganization"],
        "@id": "https://cjcsgarh.com/#school",
        "name": "Christu Jyoti Convent Sr. Sec. School",
        "alternateName": ["Christu Jyoti Convent School, Garhmukteshwar", "CJCS Garhmukteshwar"],

        "email": "cjcsgarh@gmail.com",

          "@type": "PostalAddress",

    </script>
  </head>
  <body>
    <app-root></app-root>
    <script>
      // Hide a dismissed announcement before first paint (no layout shift).
      try {
        var a = document.querySelector('[data-ann-id]');
        if (
          a &&
          localStorage.getItem('cjcs-announcement-dismissed') === a.getAttribute('data-ann-id')
        )
          a.hidden = true;
      } catch (e) {}
    </script>
  </body>
